<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="5" fill="#0c0d0b"/>

  <!-- Arms -->
  <line x1="16" y1="16" x2="6.5" y2="6.5"  stroke="#e2b13c" stroke-width="2"   stroke-linecap="round"/>
  <line x1="16" y1="16" x2="25.5" y2="6.5"  stroke="#e2b13c" stroke-width="2"   stroke-linecap="round"/>
  <line x1="16" y1="16" x2="6.5" y2="25.5"  stroke="#e2b13c" stroke-width="2"   stroke-linecap="round"/>
  <line x1="16" y1="16" x2="25.5" y2="25.5" stroke="#e2b13c" stroke-width="2"   stroke-linecap="round"/>

  <!-- Rotors -->
  <circle cx="6.5"  cy="6.5"  r="4" fill="none" stroke="#e2b13c" stroke-width="1.5"/>
  <circle cx="25.5" cy="6.5"  r="4" fill="none" stroke="#e2b13c" stroke-width="1.5"/>
  <circle cx="6.5"  cy="25.5" r="4" fill="none" stroke="#e2b13c" stroke-width="1.5"/>
  <circle cx="25.5" cy="25.5" r="4" fill="none" stroke="#e2b13c" stroke-width="1.5"/>

  <!-- Rotor spin lines -->
  <line x1="6.5"  y1="2.5"  x2="6.5"  y2="10.5" stroke="#c0562f" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <line x1="2.5"  y1="6.5"  x2="10.5" y2="6.5"  stroke="#c0562f" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <line x1="25.5" y1="2.5"  x2="25.5" y2="10.5" stroke="#c0562f" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <line x1="21.5" y1="6.5"  x2="29.5" y2="6.5"  stroke="#c0562f" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <line x1="6.5"  y1="21.5" x2="6.5"  y2="29.5" stroke="#c0562f" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <line x1="2.5"  y1="25.5" x2="10.5" y2="25.5" stroke="#c0562f" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <line x1="25.5" y1="21.5" x2="25.5" y2="29.5" stroke="#c0562f" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <line x1="21.5" y1="25.5" x2="29.5" y2="25.5" stroke="#c0562f" stroke-width="1" stroke-linecap="round" opacity=".7"/>

  <!-- Body -->
  <rect x="12.5" y="12.5" width="7" height="7" rx="1.5" fill="#1e2018" stroke="#e2b13c" stroke-width="1"/>

  <!-- Camera lens -->
  <circle cx="16" cy="16" r="2" fill="#c0562f"/>
  <circle cx="16" cy="16" r="0.8" fill="#ff7a50" opacity=".8"/>
</svg>
